<!DOCTYPE html>
<html lang="en" data-theme="dawn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do-list</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons"/>
    <script src="https://cdn.jsdelivr.net/npm/lemonadejs/dist/lemonade.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@calendarjs/ce/dist/index.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dat-gui/0.7.9/dat.gui.min.js"></script>
</head>
<body>
    <div id="app">
        <header>
            <button
                class="dark-mode-toggle"
                id="theme-toggle"
                type="button"
                data-theme-toggle
                aria-hidden="true">

                <svg class="dark-mode-toggle__icon" width="24" height="24" viewBox="0 0 24 24">
                <defs>
                <mask id="mask">
                    <rect x="0" y="0" width="100%" height="100%" fill="white"/>
                    <circle class="dark-mode-toggle__cut-out" r="6" cx=24 cy="10" fill="black"  />
                </mask>
                </defs>
                <circle class="dark-mode-toggle__center-circle" r="6" cx="12" cy="12" fill="currentColor" mask="url(#mask)"/>
                <g class="dark-mode-toggle__rays" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                <line x1="12" x2="12" y1="3" y2="1" />
                <line x1="21" x2="23" y1="12" y2="12" />
                <line x1="12" x2="12" y1="21" y2="23" />
                <line x1="1" x2="3" y1="12" y2="12" />
                </g>
                <g class="dark-mode-toggle__rays" stroke="currentColor" stroke-width="2" stroke-linecap="round" transform="rotate(45 12 12)">
                <line x1="12" x2="12" y1="3" y2="1" />
                <line x1="21" x2="23" y1="12" y2="12" />
                <line x1="12" x2="12" y1="21" y2="23" />
                <line x1="1" x2="3" y1="12" y2="12" />
                </g>
            </svg>
            </button>
        </header>
        <div class="wrapper">
            <canvas class="c1"></canvas>
        </div>
        <div id="PageContent">
        </div>
        <footer>
              <div class="reflection-wrapper">
                <canvas class="c2"></canvas>
            </div>
        </footer>
    </div>
</body>
</html>
